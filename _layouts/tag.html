---
layout: default
---

<h1>Posts tagged with "{{ page.tag }}"</h1>

<ul>
  {% for post in site.posts %}
    {% if post.tags contains page.tag %}
      <li class="post-preview">
        <div>
          <a href="{{ post.url }}">{{ post.title }}</a><br>
          <small>
            {{ post.date | date: "%B %d, %Y" }}{% if post.read_time %} - {{ post.read_time }}{% endif %}
          </small>
        </div>
      </li>
    {% endif %}
  {% endfor %}
</ul>
