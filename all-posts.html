---
layout: default
title: All Posts
---

<h1>All Posts</h1>
<br>

<ul>
  {% for post in site.posts %}
    {% unless post.tags contains "hidden-2" %}
      <li class="post-preview">
        <div>
          <a href="{{ post.url }}">{{ post.title }}</a> <br>
          <small>
            {{ post.date | date: "%B %d, %Y" }}{% if post.read_time %} - {{ post.read_time}}{% endif %}
          </small> <br>
        </div>
      </li>
    {% endunless %}
  {% endfor %}
</ul>
